name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: "Release: tag, GitHub release, PyPI and notify the other repositories. Untick to only build and test (also works on a branch)."
        type: boolean
        default: true

# One release at a time: the number is decided at the start of the run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release number: one more than the highest number that already exists, as a
  # tag v<number>. github.run_number also counts every pull request and
  # every cancelled run, which leaves gaps.
  version:
    name: Release number
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.next.outputs.number }}
    steps:
      - name: Next release number
        id: next
        env:
          PYPI_PACKAGES: ""
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          numbers = []

          tags = subprocess.run(
              ["git", "ls-remote", "--tags", f"https://github.com/{repo}.git"],
              check=True, capture_output=True, text=True,
          ).stdout
          for line in tags.splitlines():
              match = re.search(r"refs/tags/v(\d+)$", line)
              if match:
                  numbers.append(int(match.group(1)))

          # A number that is on PyPI can never be used again, even if the run that
          # uploaded it failed before it created a tag.
          for package in os.environ["PYPI_PACKAGES"].split():
              with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json") as response:
                  numbers += [int(v) for v in json.load(response)["releases"] if v.isdigit()]

          if not numbers:
              raise SystemExit("no earlier release number found")
          number = max(numbers) + 1
          print(f"next release number: {number}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"number={number}\n")
          PY

  # The same script that builds locally, natively on an ARM runner (the unit tests run natively too,
  # no qemu). This is the release.
  build:
    name: Build
    needs: version
    # A manual run releases too, unless "release" is unticked; releasing is only allowed on main.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !inputs.release)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: python3 build.py --version ${{ needs.version.outputs.number }} --test

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: stm32-data-reader-deb
          path: builds/stm32-data-reader_*_arm64.deb

  release:
    name: Release
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: stm32-data-reader-deb
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.number }}
          name: v${{ needs.version.outputs.number }}
          generate_release_notes: true
          body: |
            Install on the Pi (arm64):

            ```
            sudo apt install ./stm32-data-reader_${{ needs.version.outputs.number }}_arm64.deb
            ```

            Installs the reader to `/usr/bin`, the STM32 firmware with its flash scripts to
            `/usr/lib/stm32-data-reader/firmware`, flashes the firmware when the hardware is
            there, and starts the services.
          files: dist/stm32-data-reader_${{ needs.version.outputs.number }}_arm64.deb

      # As the Raccoon OS Bot, not with a personal token. The release is already
      # published here, so a failure only warns.
      - name: Create an app token for raccoon-image
        id: image-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: htl-stp-ecer
          repositories: raccoon-image
          permission-contents: write

      - name: Trigger raccoon-image bundle
        env:
          TOKEN: ${{ steps.image-token.outputs.token }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::no app token; raccoon-image was not notified"; exit 0; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/htl-stp-ecer/raccoon-image/dispatches \
            -d '{"event_type":"component-released","client_payload":{"component":"stm32-data-reader","version":"v${{ needs.version.outputs.number }}"}}' \
            || echo "::warning::could not notify raccoon-image"
