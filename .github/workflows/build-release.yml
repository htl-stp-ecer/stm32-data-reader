name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# One release at a time: the number is decided at the start of the run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release number: one more than the highest number that already exists, as a
  # tag v<number>. github.run_number also counts every pull request and
  # every cancelled run, which leaves gaps.
  version:
    name: Release number
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.next.outputs.number }}
    steps:
      - name: Next release number
        id: next
        env:
          PYPI_PACKAGES: ""
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          numbers = []

          tags = subprocess.run(
              ["git", "ls-remote", "--tags", f"https://github.com/{repo}.git"],
              check=True, capture_output=True, text=True,
          ).stdout
          for line in tags.splitlines():
              match = re.search(r"refs/tags/v(\d+)$", line)
              if match:
                  numbers.append(int(match.group(1)))

          # A number that is on PyPI can never be used again, even if the run that
          # uploaded it failed before it created a tag.
          for package in os.environ["PYPI_PACKAGES"].split():
              with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json") as response:
                  numbers += [int(v) for v in json.load(response)["releases"] if v.isdigit()]

          if not numbers:
              raise SystemExit("no earlier release number found")
          number = max(numbers) + 1
          print(f"next release number: {number}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"number={number}\n")
          PY

  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          cd firmware
          docker compose build
          docker compose up --exit-code-from build-wombat-firmware

      - name: Stage firmware artifacts
        run: |
          mkdir -p firmware-out
          cp firmware/build/Firmware/wombat.bin firmware-out/
          cp firmware/flashFiles/* firmware-out/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware-out/*

  build-reader:
    needs: version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ARM64 binary
        run: |
          SKIP_FIRMWARE=1 BUILD_NUMBER=${{ needs.version.outputs.number }} NINJA_JOBS=4 bash ./build.sh
        env:
          CCACHE_HOST_DIR: ${{ github.workspace }}/.ccache

      - name: Upload reader artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader
          path: build/stm32_data_reader

  release:
    needs: [ build-firmware, build-reader, version ]
    # A manual run releases too, so only allow it on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: artifacts/firmware

      - name: Download reader artifact
        uses: actions/download-artifact@v4
        with:
          name: reader
          path: artifacts/reader

      - name: Bundle release files
        run: |
          mkdir -p release
          cp artifacts/reader/stm32_data_reader release/
          cp artifacts/firmware/wombat.bin release/
          cp artifacts/firmware/flash_wombat.sh release/
          cp artifacts/firmware/reset_coprocessor.sh release/
          cp artifacts/firmware/init_gpio.sh release/
          cp install.py release/
          cp systemd/stm32_data_reader.service release/
          cp systemd/lcm-loopback-multicast.service release/
          # The reader contains nlohmann/json (MIT) through raccoon-transport; ship its notice.
          cp THIRD_PARTY_NOTICES.md release/
          cp raccoon-transport/cpp/third_party/nlohmann/LICENSE.MIT release/LICENSE.nlohmann-json.MIT
          echo "Release contents:" && ls -la release/
          cd release && tar czf ../stm32_data_reader-v${{ needs.version.outputs.number }}.tar.gz *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.number }}
          name: v${{ needs.version.outputs.number }}
          generate_release_notes: true
          files: stm32_data_reader-v${{ needs.version.outputs.number }}.tar.gz

      # As the Raccoon OS Bot, not with a personal token. The release is already
      # published here, so a failure only warns.
      - name: Create an app token for raccoon-image
        id: image-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: htl-stp-ecer
          repositories: raccoon-image
          permission-contents: write

      - name: Trigger raccoon-image bundle
        env:
          TOKEN: ${{ steps.image-token.outputs.token }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::no app token; raccoon-image was not notified"; exit 0; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/htl-stp-ecer/raccoon-image/dispatches \
            -d '{"event_type":"component-released","client_payload":{"component":"stm32-data-reader","version":"v${{ needs.version.outputs.number }}"}}' \
            || echo "::warning::could not notify raccoon-image"
