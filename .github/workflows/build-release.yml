name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          cd firmware
          docker compose build
          docker compose up --exit-code-from build-wombat-firmware

      - name: Stage firmware artifacts
        run: |
          mkdir -p firmware-out
          cp firmware/build/Firmware/wombat.bin firmware-out/
          cp firmware/flashFiles/* firmware-out/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware-out/*

  build-reader:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ARM64 binary
        run: |
          SKIP_FIRMWARE=1 BUILD_NUMBER=${{ github.run_number }} NINJA_JOBS=4 bash ./build.sh
        env:
          CCACHE_HOST_DIR: ${{ github.workspace }}/.ccache

      - name: Upload reader artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader
          path: build/stm32_data_reader

  release:
    needs: [ build-firmware, build-reader ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: artifacts/firmware

      - name: Download reader artifact
        uses: actions/download-artifact@v4
        with:
          name: reader
          path: artifacts/reader

      - name: Build .deb package
        run: |
          chmod +x artifacts/reader/stm32_data_reader artifacts/firmware/*.sh
          VERSION=1.0.${{ github.run_number }} \
          READER_BIN="$PWD/artifacts/reader/stm32_data_reader" \
          FIRMWARE_DIR="$PWD/artifacts/firmware" \
          OUTPUT_DIR="$PWD/dist" \
          bash scripts/build_deb.sh
          echo "DEB_PATH=$(ls dist/*.deb)" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: ${{ env.DEB_PATH }}

      - name: Trigger raccoon-image bundle
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/htl-stp-ecer/raccoon-image/dispatches \
            -d '{"event_type":"component-released","client_payload":{"component":"stm32-data-reader","version":"v1.0.${{ github.run_number }}"}}'
