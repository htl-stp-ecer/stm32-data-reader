name: Bump transport

# Moves the raccoon-transport submodule to a new release tag and opens a pull
# request for it (the pin gate then runs on that pull request).
#
# Triggered by raccoon-transport ("transport-released", with the tag in the
# payload) after its release is on PyPI, or by hand. A newer release updates the
# same pull request; a tag that is not newer than the current pin is ignored.
#
# The pull request is opened with the raccoon-os-bot app token: a pull request
# opened with the default token would not start the pin gate.

on:
  repository_dispatch:
    types: [transport-released]
  workflow_dispatch:
    inputs:
      tag:
        description: Transport release tag, e.g. v70 (empty = latest release)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Work out the tag
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${PAYLOAD_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag=$(gh release view -R htl-stp-ecer/raccoon-transport --json tagName --jq .tagName)
          fi
          if ! [[ "$tag" =~ ^v[0-9]+$ ]]; then
            echo "::error::'$tag' is not a transport release tag (expected v<number>)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Move the submodule
        id: bump
        env:
          TAG: ${{ steps.what.outputs.tag }}
          SUBMODULE_PATH: raccoon-transport
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          url = "https://github.com/htl-stp-ecer/raccoon-transport.git"
          path = os.environ["SUBMODULE_PATH"]
          tag = os.environ["TAG"]

          def out(*cmd):
              return subprocess.run(cmd, check=True, capture_output=True, text=True).stdout

          # Tag -> commit. An annotated tag lists its commit on the peeled (^{}) line.
          tags = {}
          for line in out("git", "ls-remote", "--tags", url).splitlines():
              sha, ref = line.split("\t")
              name = ref.removeprefix("refs/tags/")
              if name.endswith("^{}"):
                  tags[name[:-3]] = sha
              else:
                  tags.setdefault(name, sha)
          if tag not in tags:
              raise SystemExit(f"tag {tag} not found in raccoon-transport")
          new_sha = tags[tag]

          current = out("git", "ls-tree", "HEAD", path).split()[2]

          def key(name):
              match = re.fullmatch(r"v(\d+(?:\.\d+)*)", name)
              return tuple(int(p) for p in match.group(1).split(".")) if match else None

          current_names = [n for n, s in tags.items() if s == current and key(n)]
          current_name = max(current_names, key=key) if current_names else "an untagged commit"

          with open(os.environ["GITHUB_OUTPUT"], "a") as github_output:
              github_output.write(f"old={current_name}\n")
              if current == new_sha:
                  print(f"{path} is already at {tag}")
                  github_output.write("changed=false\n")
                  raise SystemExit(0)
              if current_names and key(tag) <= max(key(n) for n in current_names):
                  print(f"{tag} is not newer than {current_name}, nothing to do")
                  github_output.write("changed=false\n")
                  raise SystemExit(0)
              # Set the pointer without checking the submodule out.
              subprocess.run(
                  ["git", "update-index", "--add", "--cacheinfo", f"160000,{new_sha},{path}"],
                  check=True,
              )
              print(f"{path}: {current_name} -> {tag} ({new_sha[:7]})")
              github_output.write("changed=true\n")
          PY

      - name: Create an app token
        id: app-token
        if: steps.bump.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: htl-stp-ecer
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: bump/raccoon-transport
          delete-branch: true
          add-paths: "raccoon-transport"
          commit-message: Pin raccoon-transport to ${{ steps.what.outputs.tag }}
          title: Pin raccoon-transport to ${{ steps.what.outputs.tag }}
          body: |
            Moves the `raccoon-transport` submodule from
            `${{ steps.bump.outputs.old }}` to `${{ steps.what.outputs.tag }}`.

            Opened automatically after the transport release. The pin gate checks that
            the new commit is a released tag. Whether this component still builds and
            runs against the new transport is not tested here: merging releases this
            repository if its release workflow is enabled.
